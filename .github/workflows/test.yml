name: Run Tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    env:
      TESTING: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10' 
      
      - name: Setup Python Virtual Environment
        run: python3 -m venv env
      
      - name: Install Dependencies
        run: | 
          env/bin/pip install -r ./Data_2026/requirements.txt
          pip install pytest

      - name: Run Tests
        run: python3 -m pytest Data_2026 -v
